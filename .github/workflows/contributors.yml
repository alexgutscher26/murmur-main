name: Contributor Recognition

on:
  push:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "src/**"
      - "website/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update-contributors:
    name: Sync Contributors Ledger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Contributors File Exists
        run: |
          if [ ! -f "CONTRIBUTORS.md" ]; then
            echo "CONTRIBUTORS.md missing!"
            exit 1
          fi
          echo "CONTRIBUTORS.md is up to date."
