<!--
  SOURCE OF TRUTH KEYWORDS: pill-window, pill.html, pill-entry, transparent-window
  WHAT:  The pill overlay document. Loads src/entries/pill.tsx.
  WHY:   Its own document so the overlay ships no charts, no tables and no
         router. The body is transparent through styles/global.css, which is
         one of the three things Tauri transparency needs (docs/03 §3.6).
  WHERE: Opened as the NSPanel overlay by src-tauri.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Murmur</title>
    <!-- Apply stored theme before first paint to prevent flash of wrong theme.
         Mirrors the logic in src/lib/theme.ts — must stay in sync. -->
    <script>
      (function () {
        var t = localStorage.getItem("murmur_theme_preference");
        var isDark =
          t === "dark" ||
          (t !== "light" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
        if (isDark) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        background-color: transparent;
        color: var(--text-primary);
        font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
      }
    </style>
  </head>
  <body data-window="pill">
    <div id="root"></div>
    <script type="module" src="/src/entries/pill.tsx"></script>
  </body>
</html>
