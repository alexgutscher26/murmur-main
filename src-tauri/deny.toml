# SOURCE OF TRUTH KEYWORDS: cargo-deny, deny.toml, licenses, bans, supply-chain
# WHAT:  Configuration for `cargo-deny` to audit licenses, bans, advisories and sources.
# WHY:   Guards the build against copyleft / GPL-incompatible licenses, vulnerable dependencies,
#        and untrusted or duplicate crates in the Rust supply chain.
# WHERE: Configuration for `cargo-deny check` in src-tauri.

[graph]
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
]
confidence-threshold = 0.8
copyleft = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[advisories]
vulnerability = "deny"
unmaintained = "warn"
unsound = "warn"
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
